import = [
    "~/.config/alacritty/themes/catppuccin-mocha.toml"
]

live_config_reload = true

[shell]
program = "/bin/zsh"
args = ["-l"]

[window]
padding = {"x" = 5, "y" = 5}
startup_mode = "Fullscreen"
opacity = 1.0

[font]
size = 12.0
normal = {family = "FiraCode Nerd Font Mono", style = "Regular"}

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "Off"
shape = "Block"

[mouse]
hide_when_typing = true
